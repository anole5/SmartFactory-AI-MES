server:
  port: 8080
  servlet:
    # 所有接口统一挂 /api 前缀，前端 vite proxy 直接透传、无需重写路径
    context-path: /api

# JWT 配置（HS256 密钥至少 32 字节；演示用固定值，生产应从环境变量/配置中心注入）
jwt:
  secret: smartfactory-mes-demo-secret-key-20260823
  expire-hours: 24

# 设备状态漂移模拟（演示：定时随机漂移设备状态供看板展示，enabled=false 整体关闭）
equipment:
  simulate:
    enabled: true
    interval-ms: 15000

# AI 接入（DeepSeek OpenAI 兼容接口）：flash 档做快速问答/意图识别，pro 档做复杂推理
# api-key 只放环境变量或 gitignored 的 application-local.yml，绝不入库
ai:
  deepseek:
    base-url: https://api.deepseek.com
    api-key: ${DEEPSEEK_API_KEY:}
    fast-model: deepseek-v4-flash
    pro-model: deepseek-v4-pro
    timeout-seconds: 60
    # flash 快档轻任务 1500 够用；pro 是推理模型，reasoning 会吃预算，给 8000（实测推理 3k + 回答 1.4k）
    max-tokens-fast: 1500
    max-tokens-pro: 8000

spring:
  application:
    name: smartfactory-mes
  profiles:
    # 叠加本地配置：application-local.yml（gitignored，存放真实 DeepSeek Key）
    include: local
  datasource:
    # 开发环境复用本机 Docker 的 mysql:8.0 容器（尚硅谷课程栈，端口 3306）
    url: jdbc:mysql://localhost:3306/smartfactory_mes?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: smartfactory
    password: Smartfactory@123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    # 开发期打印 SQL，方便调试；上线可改为 org.apache.ibatis.logging.nologging.NoLoggingImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # 下划线列名 <-> 驼峰属性 自动映射
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 逻辑删除：所有实体继承 BaseEntity 的 deleted 字段
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      # 主键策略：数据库 AUTO_INCREMENT（演示项目 ID 小、调试直观，
      # 也避免雪花 19 位 Long 传到前端 JS 丢精度；业务单号第 2 周由 IdGenerator 生成）
      id-type: auto

logging:
  level:
    com.smartfactory.mes: debug
