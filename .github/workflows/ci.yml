# 第 8 周 CI：push 触发 构建+单测（build-test）→ 无 AI 环境冒烟（smoke）
# 设计要点：
# - smoke 无 DeepSeek Key（Key 绝不进仓库）：SMOKE_SKIP_AI=1 跳过 5 项 AI 断言 + 1 项降级放行
# - 无 qdrant/TEI：召回自动退化关键词通道，reindex 等硬依赖项已被 gate
# - mysql 服务容器必须 LANG=C.UTF-8（官方镜像默认 latin1 会把中文种子双重编码成乱码，
#   与 compose 同坑）；TZ 统一 Asia/Shanghai 与 JDBC serverTimezone 对齐
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: 构建 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 坑：.mvn/maven.config 写死本机 Windows 仓库路径，CI 环境必须删掉（只删工作区副本）
      - name: 后端构建 + T1 单元测试
        run: cd backend && rm -f .mvn/maven.config && mvn -B -ntp package

      - name: 前端构建
        run: cd frontend && npm ci && npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/target/smartfactory-mes-backend-0.1.0.jar
          retention-days: 1

  smoke:
    name: 无 AI 环境冒烟
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          TZ: Asia/Shanghai
          LANG: C.UTF-8
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 字母序 = 执行序：00-init 建库建账号（root 执行），01~14 自带 USE smartfactory_mes
      - name: 导入 SQL 种子
        run: |
          for f in sql/*.sql; do
            mysql -h127.0.0.1 -uroot -proot --default-character-set=utf8mb4 < "$f"
          done

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: /tmp/mes

      - name: 启动后端（后台，无 AI Key 环境）
        env:
          TZ: Asia/Shanghai
        run: |
          java -jar /tmp/mes/smartfactory-mes-backend-0.1.0.jar > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid

      - name: 等待就绪（actuator health 探测，T2 产物）
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/actuator/health > /dev/null; then
              echo "backend UP after ~$((i * 3))s"; exit 0
            fi
            sleep 3
          done
          echo "backend NOT ready"; tail -50 /tmp/backend.log; exit 1

      - name: 冒烟（SMOKE_SKIP_AI=1）
        run: SMOKE_SKIP_AI=1 node scripts/smoke.mjs

      - name: 后端日志（失败排查）
        if: failure()
        run: tail -100 /tmp/backend.log
