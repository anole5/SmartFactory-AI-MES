server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue createWebHistory 路由：未知路径回落到 index.html，由前端路由接管
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端反代：proxy_pass 无尾斜杠 = URI 原样透传（后端 context-path 就是 /api，不重写）
    # SSE（AI 流式回答）必须关代理缓冲，否则事件被 nginx 攒批、前端收不到流
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
